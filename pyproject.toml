[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-ofc"
version = "1.0.0"
description = "Assistente pessoal modular com LangGraph, voz local e Home Assistant"
requires-python = ">=3.11,<3.14"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-core.txt", "requirements-ml.txt"]}

[tool.setuptools.packages.find]
include = ["app*"]

[project.scripts]
jarvis = "app.main:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008"]  # FastAPI Depends is evaluated intentionally in signatures.

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
