[project]
name = "jarvis-hybrid-reference"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3", "langgraph>=1,<2",
  "langchain-core>=1,<2", "langchain-openai>=1,<2",
  "langchain-google-genai>=4,<5", "langchain-ollama>=1,<2",
  "chromadb>=1.0,<2", "neo4j>=5.26,<6", "aiomqtt>=2.3,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=1,<2", "mypy>=1.15,<2", "ruff>=0.12,<1"]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.11"
strict = true
files = ["hybrid"]

[[tool.mypy.overrides]]
module = ["chromadb.*", "neo4j.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
