name: Hybrid reference
on:
  push:
    branches: [architecture/hybrid-realtime]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/hybrid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.10.0
      - run: uv lock
      - run: uv sync --locked
      - run: uv run --locked python -m compileall -q hybrid
      - run: uv run --locked mypy hybrid
      - run: uv run --locked pytest -q
      - run: uv export --locked --no-dev --no-emit-project --format requirements-txt > requirements.lock
      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-locked-dependencies
          path: |
            examples/hybrid/uv.lock
            examples/hybrid/requirements.lock
      - run: docker build -t jarvis-hybrid-reference .
