name: Windows command center
on:
  push:
    branches: [architecture/hybrid-realtime, main]
    paths: [JARVIS.bat, scripts/test_windows_panel.py, scripts/test_windows_launcher.py, app/api/launcher.py, .github/workflows/windows-panel.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  panel:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/test_windows_panel.py
      - run: python -m pip install pydantic-settings python-dotenv tzdata
      - run: python scripts/test_windows_launcher.py
