name: Validate JARVIS
on:
  push:
    branches: [main, architecture/hybrid-realtime]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Core / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pip check
      - run: ruff check app tests
      - run: python -m compileall -q app tests
      - run: python -m pytest -q
      - run: python -m app.main --help
      - run: python -m pip freeze > resolved-core.txt
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-core-${{ matrix.python }}
          path: resolved-core.txt
  full-install:
    name: Full CPU installation / Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libportaudio2
      - run: python -m pip install --upgrade pip
      - run: python -m pip install 'torch>=2.6,<3.0' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -c "import whisper, sounddevice, sentence_transformers; from app.audio.stt import WhisperSTT; from app.audio.tts import SpeechSynthesizer"
      - run: ffplay -version
      - run: python -m pytest -q
      - run: python -m pip freeze --exclude-editable > resolved-full-cpu.txt
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-full-cpu-python311-linux
          path: resolved-full-cpu.txt
